name: SupahBetting checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python unit- en integratietests
        run: python -m unittest discover -s tests -v
      - name: Python-syntax
        run: python -m compileall -q supahbetting
      - name: JavaScript-syntax
        run: |
          node --check supahbetting/static/app.js
          node --check supahbetting/static/live.js
          node --check supahbetting/static/research.js
          node --check supahbetting/static/model.js
