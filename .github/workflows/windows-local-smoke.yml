name: Windows universal trainer smoke checks

on:
  push:
    branches: [feature/model-v0.11.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python training modules and upload guardrails
        run: python -m unittest discover -s tests -v
      - name: Detect real Windows hardware
        run: python -m supahbetting.hardware_profile --cap 16
      - name: Verify automatic worker sizing
        shell: pwsh
        run: |
          $workers = [int](python -m supahbetting.hardware_profile --cap 16 --workers-only)
          if ($LASTEXITCODE -ne 0 -or $workers -lt 1 -or $workers -gt 16) {
            throw "Worker count outside 1..16: $workers"
          }
          Write-Host "Auto-selected workers: $workers"
      - name: Verify ZIP-friendly upload command is callable
        run: python -m supahbetting.github_training_sync --help
